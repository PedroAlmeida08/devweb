spring.application.name=apirestfulv1

spring.datasource.url=jdbc:mysql://localhost:3306/springbanco
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configura��es
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=2

spring.jpa.show-sql=true

# Cria automaticamente as tabelas do package model
spring.jpa.hibernate.ddl-auto=create
# dropa e cria em seguida